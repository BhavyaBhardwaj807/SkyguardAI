services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: skyguard
      POSTGRES_PASSWORD: skyguard_local
      POSTGRES_DB: skyguard
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skyguard -d skyguard"]
      interval: 5s
      timeout: 3s
      retries: 15
  detection:
    build: ./ml-service
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.node
    command: ["npm", "run", "start:api"]
    environment:
      DATABASE_URL: postgres://skyguard:skyguard_local@db:5432/skyguard
      DETECTION_BASE_URL: http://detection:8000
      ALLOWED_ORIGIN: http://localhost:8080
      DEMO_MODE: "true"
    depends_on:
      db: { condition: service_healthy }
    stop_grace_period: 130s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.node
    environment:
      INTERNAL_API_BASE_URL: http://api:4000
    depends_on:
      api: { condition: service_healthy }
  proxy:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:8080:80"]
    volumes: ["./docker/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [web, api]
volumes:
  postgres_data:
