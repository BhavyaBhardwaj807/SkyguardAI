events {}
http {
 server {
  listen 80;
  client_max_body_size 256k;
  location /api/ {
   proxy_pass http://api:4000;
   proxy_http_version 1.1;
   proxy_set_header Connection "";
   proxy_buffering off;
   proxy_cache off;
   proxy_read_timeout 1h;
  }
  location /healthz { proxy_pass http://api:4000; }
  location /readyz { proxy_pass http://api:4000; }
  location / { proxy_pass http://web:3000; proxy_http_version 1.1; proxy_set_header Host $host; }
 }
}
